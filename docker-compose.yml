services:
  db:
    image: mysql:8.4
    container_name: grocery-list-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grocery_db
      MYSQL_USER: grocery_user
      MYSQL_PASSWORD: grocery_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - grocery_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: grocery-list-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  grocery_mysql_data:
